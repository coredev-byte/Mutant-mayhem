name: Clean HUD validation
on:
  push:
    branches: [feature/clean-hud]
    paths:
      - "outputs/MutantMayhem/src/**"
      - "ui-clean/**"
      - ".github/workflows/clean-hud.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install verified Luau CLI
        run: |
          curl -fLsS https://github.com/luau-lang/luau/releases/download/0.743/luau-ubuntu.zip -o /tmp/luau.zip
          echo "99d45afb4afaee00ba631c526c8e8c76c67b60f6f119953ce6409be6d6953663  /tmp/luau.zip" | sha256sum -c -
          mkdir -p /tmp/luau
          unzip -q /tmp/luau.zip -d /tmp/luau
          chmod +x /tmp/luau/luau*
      - name: Compile all game sources
        run: |
          find outputs/MutantMayhem/src -name '*.luau' -print0 | while IFS= read -r -d '' path; do /tmp/luau/luau-compile "$path" > /dev/null; done
      - name: Test HUD layout and state transitions
        run: /tmp/luau/luau ui-clean/tests/layout.luau
      - name: Exercise actual HUD and controller callbacks
        run: |
          python3 ui-clean/tests/build_hud_harness.py
          /tmp/luau/luau /tmp/clean-hud-harness.luau > /tmp/hud-test-output.txt
          grep -v "^UI_PREVIEW_" /tmp/hud-test-output.txt
      - name: Render layout illustrations
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-cairosvg
          /usr/bin/python3 ui-clean/tests/render_previews.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: clean-hud-layout-previews
          path: ui-clean/build/
          retention-days: 90
